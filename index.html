<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Karjat Farms — GroundWork</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1a2e;font-family:'Nunito',sans-serif;overflow:hidden;height:100vh;width:100vw;touch-action:none}
#game-container{position:relative;width:100%;height:100%;overflow:hidden}

/* ── CANVAS ── */
#game-canvas{position:absolute;top:0;left:0;image-rendering:pixelated;image-rendering:crisp-edges}

/* ── HUD TOP BAR ── */
#hud-top{position:absolute;top:0;left:0;right:0;z-index:10;padding:8px 12px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
.hud-card{background:rgba(255,255,255,0.12);backdrop-filter:blur(8px);border-radius:12px;padding:6px 14px;display:flex;flex-direction:column;align-items:center;min-width:80px;pointer-events:auto}
.hud-label{font-size:10px;color:rgba(255,255,255,0.6);font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.hud-value{font-size:20px;font-weight:800;color:#fff;line-height:1.1;display:flex;align-items:center;gap:4px}
.hud-sub{font-size:10px;color:rgba(255,255,255,0.5)}

/* ── TIME DISPLAY ── */
#time-display{position:absolute;top:8px;left:50%;transform:translateX(-50%);z-index:10;text-align:center;pointer-events:none}
#time-clock{font-size:clamp(18px,4vw,28px);font-weight:800;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,0.5)}
#time-phase{font-size:11px;font-weight:700;color:#FFD54F;text-transform:uppercase;letter-spacing:1px}

/* ── BOTTOM TOOLBAR ── */
#toolbar{position:absolute;bottom:0;left:0;right:0;z-index:10;display:flex;justify-content:center;padding:8px;gap:8px;background:linear-gradient(transparent,rgba(0,0,0,0.6))}
.tool-btn{background:rgba(255,255,255,0.15);backdrop-filter:blur(8px);border:2px solid rgba(255,255,255,0.2);border-radius:12px;padding:8px 14px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;transition:all .15s;min-width:64px}
.tool-btn:hover,.tool-btn.active{background:rgba(255,255,255,0.25);border-color:rgba(255,255,255,0.5)}
.tool-btn.active{background:rgba(76,175,80,0.4);border-color:#4CAF50}
.tool-btn .tool-icon{font-size:22px}
.tool-btn .tool-label{font-size:10px;color:rgba(255,255,255,0.8);font-weight:700}

/* ── INVENTORY OVERLAY ── */
#inventory-overlay{position:absolute;top:70px;right:8px;z-index:10;background:rgba(0,0,0,0.7);backdrop-filter:blur(10px);border-radius:16px;padding:12px;min-width:180px;display:none;pointer-events:auto}
#inventory-overlay.open{display:block}
.inv-title{font-size:12px;font-weight:800;color:#FFD54F;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.inv-item{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid rgba(255,255,255,0.1)}
.inv-item:last-child{border-bottom:none}
.inv-crop{flex:1;font-size:13px;color:#fff;font-weight:600}
.inv-count{font-size:14px;font-weight:800;color:#4CAF50;margin:0 8px}
.inv-sell{background:#4CAF50;border:none;border-radius:8px;color:#fff;font-size:10px;font-weight:700;padding:4px 8px;cursor:pointer}
.inv-sell:hover{background:#388E3C}
.inv-sell:disabled{background:#555;color:#888;cursor:not-allowed}
.inv-empty{font-size:11px;color:rgba(255,255,255,0.4);text-align:center;padding:8px 0}

/* ── SEED PANEL ── */
#seed-panel{position:absolute;bottom:70px;left:50%;transform:translateX(-50%);z-index:10;background:rgba(0,0,0,0.8);backdrop-filter:blur(10px);border-radius:16px;padding:10px 14px;display:none;flex-direction:row;gap:10px;pointer-events:auto}
#seed-panel.open{display:flex}
.seed-card{background:rgba(255,255,255,0.1);border-radius:12px;padding:8px 12px;text-align:center;cursor:pointer;transition:all .15s;border:2px solid transparent;min-width:70px}
.seed-card:hover{border-color:rgba(255,255,255,0.3)}
.seed-card.selected{border-color:#4CAF50;background:rgba(76,175,80,0.25)}
.seed-emoji{font-size:24px}
.seed-name{font-size:10px;font-weight:700;color:#fff;margin-top:2px}
.seed-cost{font-size:9px;color:#FFD54F;font-weight:700}
.seed-time{font-size:8px;color:rgba(255,255,255,0.5)}

/* ── NOTIFICATION ── */
#notification{position:absolute;top:60px;left:50%;transform:translateX(-50%);z-index:20;background:rgba(76,175,80,0.95);color:#fff;font-size:13px;font-weight:700;padding:8px 20px;border-radius:20px;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
#notification.show{opacity:1}

/* ── INTERACTION PROMPT ── */
#interact-prompt{position:absolute;bottom:80px;left:50%;transform:translateX(-50%);z-index:10;background:rgba(0,0,0,0.75);color:#fff;font-size:12px;font-weight:700;padding:6px 16px;border-radius:12px;display:none;pointer-events:none;text-align:center}

/* ── MINI MAP ── */
#minimap{position:absolute;bottom:80px;right:8px;z-index:10;width:100px;height:100px;background:rgba(0,0,0,0.6);border-radius:50%;border:2px solid rgba(255,255,255,0.2);overflow:hidden;pointer-events:none}
#minimap-canvas{width:100%;height:100%}
</style>
</head>
<body>
<div id="game-container">
  <canvas id="game-canvas"></canvas>

  <!-- HUD Top -->
  <div id="hud-top">
    <div class="hud-card">
      <span class="hud-label">Bushels</span>
      <span class="hud-value" id="hud-money">100</span>
    </div>
    <div class="hud-card">
      <span class="hud-label">Harvested</span>
      <span class="hud-value" id="hud-harvested">0</span>
    </div>
    <div class="hud-card">
      <span class="hud-label">Day</span>
      <span class="hud-value" id="hud-day">1</span>
    </div>
  </div>

  <!-- Time -->
  <div id="time-display">
    <div id="time-clock">--:--</div>
    <div id="time-phase">Dawn</div>
  </div>

  <!-- Seed Panel -->
  <div id="seed-panel">
    <div class="seed-card" data-crop="methi">
      <div class="seed-emoji">🌿</div>
      <div class="seed-name">Methi</div>
      <div class="seed-cost">5🪙</div>
      <div class="seed-time">20m</div>
    </div>
    <div class="seed-card" data-crop="lalsaag">
      <div class="seed-emoji">🍃</div>
      <div class="seed-name">Lal Saag</div>
      <div class="seed-cost">3🪙</div>
      <div class="seed-time">25m</div>
    </div>
    <div class="seed-card" data-crop="mula">
      <div class="seed-emoji">🥕</div>
      <div class="seed-name">Mula</div>
      <div class="seed-cost">8🪙</div>
      <div class="seed-time">30m</div>
    </div>
    <div class="seed-card" data-crop="palak">
      <div class="seed-emoji">🥬</div>
      <div class="seed-name">Palak</div>
      <div class="seed-cost">6🪙</div>
      <div class="seed-time">22m</div>
    </div>
  </div>

  <!-- Inventory -->
  <div id="inventory-overlay">
    <div class="inv-title">Harvested Crops</div>
    <div id="inventory-items"></div>
  </div>

  <!-- Toolbar -->
  <div id="toolbar">
    <button class="tool-btn active" data-tool="plant">
      <span class="tool-icon">🌱</span>
      <span class="tool-label">Plant</span>
    </button>
    <button class="tool-btn" data-tool="harvest">
      <span class="tool-icon">🧺</span>
      <span class="tool-label">Harvest</span>
    </button>
    <button class="tool-btn" data-tool="water">
      <span class="tool-icon">💧</span>
      <span class="tool-label">Water</span>
    </button>
    <button class="tool-btn" data-tool="inventory">
      <span class="tool-icon">📦</span>
      <span class="tool-label">Crops</span>
    </button>
  </div>

  <!-- Interaction prompt -->
  <div id="interact-prompt"></div>

  <!-- Notification -->
  <div id="notification"></div>
</div>

// SPRITE LOADER
// ═══════════════════════════════════════════════════════════
const sprites = {};
function loadSprites() {
  const img = new Image();
  img.onload = () => {
    const canvas = document.createElement('canvas');
    canvas.width = img.width; canvas.height = img.height;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0);
    const all = JSON.parse(SPRITE_DATA);
    for (const [cat, items] of Object.entries(all)) {
      sprites[cat] = {};
      for (const [name, src] of Object.entries(items)) {
        const i = new Image();
        i.src = src;
        sprites[cat][name] = i;
      }
    }
    console.log('Sprites loaded:', Object.keys(sprites));
  };
  img.src = 'data:text/plain,placeholder';
}

// Parse embedded sprite data
const _spriteRaw = SPRITE_DATA_JSON;
const _loadedSprites = {};
for (const [cat, items] of Object.entries(_spriteRaw)) {
  _loadedSprites[cat] = {};
  for (const [name, src] of Object.entries(items)) {
    const i = new Image();
    i.src = src;
    _loadedSprites[cat][name] = i;
  }
}
const loadedSprites = _loadedSprites;

function sp(cat, name) {
  const s = loadedSprites[cat]?.[name];
  return s || null;
}

// Build a Karjat-style farm layout
function initFarm() {
  // Paths
  const pathTiles = [
    // Main vertical path
    ...Array.from({length:30},(_,i)=>({x:15,y:i})),
    // Horizontal paths
    ...Array.from({length:20},(_,i)=>({x:i,y:8})),
    ...Array.from({length:20},(_,i)=>({x:i,y:22})),
    ...Array.from({length:15},(_,i)=>({x:i,y:15})),
    // Border paths
    ...Array.from({length:40},(_,i)=>({x:0,y:i})),
    ...Array.from({length:20},(_,i)=>({x:i,y:0})),
  ];
  pathTiles.forEach(p => { if(world[p.y]?.[p.x]) world[p.y][p.x] = {tile:T.PATH}; });

  // Crop fields (soil patches)
  const fieldAreas = [
    {x:16,y:1,w:20,h:7},   // Methi field (top)
    {x:16,y:9,w:20,h:6},  // Lal Saag field
    {x:16,y:16,w:20,h:6}, // Mula/Palak field
    {x:1,y:23,w:14,h:7},  // Extra crop area
  ];
  fieldAreas.forEach(a => {
    for (let y=a.y; y<a.y+a.h; y++)
      for (let x=a.x; x<a.x+a.w; x++)
        if(world[y]?.[x]) world[y][x] = {tile:T.SOIL};
  });

  // Buildings
  // Bungalow (center-ish)
  const bHouse = {x:1,y:1,w:14,h:10};
  for (let y=bHouse.y; y<bHouse.y+bHouse.h; y++)
    for (let x=bHouse.x; x<bHouse.x+bHouse.w; x++)
      if(world[y]?.[x]) world[y][x] = {tile:T.BUNGALOW};

  // Animal shed
  const shed = {x:1,y:12,w:13,h:8};
  for (let y=shed.y; y<shed.y+shed.h; y++)
    for (let x=shed.x; x<shed.x+shed.w; x++)
      if(world[y]?.[x]) world[y][x] = {tile:T.SHED};

  // Well
  if(world[16]?.[22]) world[16][22] = {tile:T.WELL};
  if(world[16]?.[23]) world[16][23] = {tile:T.WATER};
  if(world[17]?.[22]) world[17][22] = {tile:T.WATER};
  if(world[17]?.[23]) world[17][23] = {tile:T.WATER};

  // Trees around perimeter
  const treePositions = [];
  for (let x=40; x<58; x++) {
    if(world[1]?.[x]) {world[1][x] = {tile:T.TREE}; treePositions.push({x,y:1});}
    if(world[20]?.[x]) {world[20][x] = {tile:T.COCONUT}; treePositions.push({x,y:20});}
    if(world[30]?.[x]) {world[30][x] = {tile:T.COCONUT}; treePositions.push({x,y:30});}
  }
  for (let y=1; y<10; y++) {
    if(world[y]?.[58]) {world[y][58] = {tile:T.TREE}; treePositions.push({x:58,y});}
    if(world[y]?.[59]) {world[y][59] = {tile:T.COCONUT}; treePositions.push({x:59,y});}
  }
  for (let y=25; y<40; y++) {
    if(world[y]?.[58]) {world[y][58] = {tile:T.TREE};}
    if(world[y]?.[59]) {world[y][59] = {tile:T.COCONUT};}
  }

  // NPC spawn position (on path)
  npc.x = 15 * TILE; npc.y = 14 * TILE;
}

const camera = { x: 0, y: 0 };
function updateCamera() {
  const canvas = document.getElementById('game-canvas');
  const halfW = canvas.width / 2;
  const halfH = canvas.height / 2;
  camera.x = Math.max(0, Math.min(player.x - halfW + player.w/2, WORLD_W*TILE - canvas.width));

}

// ═══════════════════════════════════════════════════════════
// CANVAS CLICK HANDLER
// ═══════════════════════════════════════════════════════════
function handleCanvasClick(screenX, screenY) {
  const canvas = document.getElementById('game-canvas');
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  const worldX = (screenX - rect.left) * scaleX + camera.x;
  const worldY = (screenY - rect.top) * scaleY + camera.y;
  const tileX = Math.floor(worldX / TILE);
  const tileY = Math.floor(worldY / TILE);

  if (state.selectedTool === 'plant') {
    const plot = state.plots.find(p => p.x === tileX && p.y === tileY);
    if (plot && !plot.crop && state.selectedCrop) {
      const cropData = CROPS[state.selectedCrop];
      if (state.money >= cropData.cost) {
        state.money -= cropData.cost;
        plot.crop = state.selectedCrop;
        plot.plantedAt = Date.now();
        plot.growthStage = 1;
        updateHUD();
        notify(`Planted ${cropData.emoji} ${cropData.name}!`);
      } else {
        notify('Not enough Bushels!');
      }
    }
  } else if (state.selectedTool === 'harvest') {
    const plot = state.plots.find(p => p.x === tileX && p.y === tileY);
    if (plot && plot.crop) {
      const elapsed = (Date.now() - plot.plantedAt) / 60000; // minutes
      const growTime = CROPS[plot.crop].growTime;
      if (elapsed >= growTime) {
        state.inventory[plot.crop]++;
        state.harvested++;
        notify(`Harvested ${CROPS[plot.crop].emoji} ${CROPS[plot.crop].name}!`);
        plot.crop = null; plot.plantedAt = null; plot.growthStage = 0;
        updateHUD();
      } else {
        notify('Not ready yet!');
      }
    }
  } else if (state.selectedTool === 'water') {
    const plot = state.plots.find(p => p.x === tileX && p.y === tileY);
    if (plot && plot.crop) {
      plot.watered = true;
      notify('💧 Watered!');
    }
  }
}

// ═══════════════════════════════════════════════════════════
// NPC LOGIC
// ═══════════════════════════════════════════════════════════
function updateNPC(dt) {
  if (npc.pathWait > 0) { npc.pathWait -= dt; return; }
  if (npc.pathIndex >= npcPath.length) npc.pathIndex = 0;
  const target = npcPath[npc.pathIndex];
  const tx = target.x * TILE, ty = target.y * TILE;
  const dx = tx - npc.x, dy = ty - npc.y;
  const dist = Math.sqrt(dx*dx + dy*dy);
  if (dist < 2) {
    npc.pathIndex++;
    npc.pathWait = 2; // pause at waypoints
  } else {
    const nx = dx/dist, ny = dy/dist;
    npc.x += nx * npc.speed * dt;
    npc.y += ny * npc.speed * dt;
    npc.facing = Math.abs(ny) > Math.abs(nx) ? (ny > 0 ? 'down' : 'up') : (nx > 0 ? 'right' : 'left');
    npc.frameTimer += dt;
    if (npc.frameTimer > 0.3) { npc.frame = (npc.frame + 1) % 2; npc.frameTimer = 0; }
  }
}

// ═══════════════════════════════════════════════════════════
// PLAYER UPDATE
// ═══════════════════════════════════════════════════════════
function updatePlayer(dt) {
  let dx = 0, dy = 0;
  if (keys['ArrowLeft']  || keys['a'] || keys['A']) dx -= 1;
  if (keys['ArrowRight'] || keys['d'] || keys['D']) dx += 1;
  if (keys['ArrowUp']    || keys['w'] || keys['W']) dy -= 1;
  if (keys['ArrowDown']  || keys['s'] || keys['S']) dy += 1;

  if (dx !== 0 && dy !== 0) { dx *= 0.707; dy *= 0.707; }

  player.moving = dx !== 0 || dy !== 0;
  if (player.moving) {
    const nx = player.x + dx * player.speed * dt;
    const ny = player.y + dy * player.speed * dt;
    if (!isBlocked(nx, player.y)) player.x = nx;
    if (!isBlocked(player.x, ny)) player.y = ny;
    player.facing = Math.abs(dy) > Math.abs(dx) ? (dy > 0 ? 'down' : 'up') : (dx > 0 ? 'right' : 'left');
    player.frameTimer += dt;
    if (player.frameTimer > 0.18) { player.frame = (player.frame + 1) % 2; player.frameTimer = 0; }
  }
}

function isBlocked(x, y) {
  const pad = 4;
  const corners = [
    {x: x+pad, y: y+pad},
    {x: x+player.w-pad, y: y+pad},
    {x: x+pad, y: y+player.h-pad},
    {x: x+player.w-pad, y: y+player.h-pad},
  ];
  for (const c of corners) {
    const tx = Math.floor(c.x / TILE), ty = Math.floor(c.y / TILE);
    if (ty < 0 || ty >= WORLD_H || tx < 0 || tx >= WORLD_W) return true;
    const t = world[ty]?.[tx]?.tile;
    if (t === T.BUNGALOW || t === T.SHED || t === T.TREE || t === T.COCONUT || t === T.WATER) return true;
  }
  return false;
}

// ═══════════════════════════════════════════════════════════
// TIME SYSTEM (Real Karjat time)
// ═══════════════════════════════════════════════════════════
function getKarjatTime() {
  // Asia/Kolkata offset from UTC
  const now = new Date();
  const utc = now.getTime() + now.getTimezoneOffset() * 60000;
  const kartajatOffset = 5.5 * 3600000;
  return new Date(utc + kartajatOffset);
}

function updateTimeDisplay() {
  const kt = getKarjatTime();
  const hours = kt.getHours(), mins = kt.getMinutes();
  const timeStr = `${String(hours).padStart(2,'0')}:${String(mins).padStart(2,'0')}`;
  document.getElementById('time-clock').textContent = timeStr;
  
  let phase = 'Dawn';
  if (hours >= 5 && hours < 10) phase = 'Morning';
  else if (hours >= 10 && hours < 14) phase = 'Midday';
  else if (hours >= 14 && hours < 17) phase = 'Afternoon';
  else if (hours >= 17 && hours < 19) phase = 'Evening';
  else if (hours >= 19 && hours < 22) phase = 'Dusk';
  else phase = 'Night';
  
  document.getElementById('time-phase').textContent = phase;
  return hours;
}

// ═══════════════════════════════════════════════════════════
// SKY COLORS BY TIME
// ═══════════════════════════════════════════════════════════
function getSkyColor(hours) {
  if (hours >= 5 && hours < 7)  return {r:255,g:180,b:120};  // Dawn
  if (hours >= 7 && hours < 10) return {r:135,g:206,b:235};  // Morning
  if (hours >= 10 && hours < 17) return {r:87,g:166,b:255}; // Day
  if (hours >= 17 && hours < 19) return {r:255,g:140,b:80};  // Evening
  if (hours >= 19 && hours < 22) return {r:30,g:30,b:80};    // Dusk
  return {r:10,g:10,b:40};                                    // Night
}

// HUD UPDATE
// ═══════════════════════════════════════════════════════════
function updateHUD() {
  document.getElementById('hud-money').textContent = `🌾 ${state.money}`;
  document.getElementById('hud-harvested').textContent = state.harvested;
  document.getElementById('hud-day').textContent = state.day;
  
  // Inventory
  const container = document.getElementById('inventory-items');
  container.innerHTML = '';
  const hasCrops = Object.values(state.inventory).some(v => v > 0);
  if (!hasCrops) container.innerHTML = '<div class="inv-empty">No crops harvested yet.</div>';
  Object.entries(state.inventory).forEach(([key, count]) => {
    if (count === 0) return;
    const c = CROPS[key];
    const div = document.createElement('div');
    div.className = 'inv-item';
    div.innerHTML = `
      <span class="inv-crop">${c.emoji} ${c.name}</span>
      <span class="inv-count">x${count}</span>
      <button class="inv-sell" data-crop="${key}">Sell ${c.price}🪙</button>
    `;
    container.appendChild(div);
  });
  container.querySelectorAll('.inv-sell').forEach(btn => {
    btn.addEventListener('click', () => sellCrop(btn.dataset.crop));
  });
}

function sellCrop(key) {
  const c = CROPS[key];
  const count = state.inventory[key];
  if (count === 0) return;
  const earned = count * c.price;
  state.money += earned;
  state.inventory[key] = 0;
  updateHUD();
  notify(`Sold x${count} ${c.emoji} for ${earned} Bushels!`);
}

function notify(msg) {
  const el = document.getElementById('notification');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._timer);
  el._timer = setTimeout(() => el.classList.remove('show'), 2000);
}

// ═══════════════════════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════════════════════
const canvas = document.getElementById('game-canvas');
const ctx = canvas.getContext('2d');

function resizeCanvas() {
  const d = document.getElementById('game-container');
  canvas.width = d.clientWidth;
  canvas.height = d.clientHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

// Sprite cache
const spriteCache = {};
function getSprite(cat, name) {
  if (!spriteCache[`${cat}/${name}`]) {
    const src = _loadedSprites[cat]?.[name]?.src;
    if (!src) return null;
    spriteCache[`${cat}/${name}`] = { src };
  }
  const key = `${cat}/${name}`;
  if (!spriteCache[key].img) {
    if (!spriteCache[key].loading) {
      const img = new Image();
      img.src = spriteCache[key].src;
      spriteCache[key].loading = true;
      img.onload = () => { spriteCache[key].img = img; };
    }
    return null;
  }
  return spriteCache[key].img;
}

function drawSprite(cat, name, sx, sy, sw=16, sh=16) {
  const src = _loadedSprites[cat]?.[name]?.src;
  if (!src) {
    // Fallback: draw colored rect
    ctx.fillStyle = '#888';
    ctx.fillRect(sx, sy, sw, sh);
    return;
  }
  const key = `${cat}/${name}`;
  if (!spriteCache[key]) {
    const img = new Image();
    img.src = src;
    img.onload = () => { spriteCache[key] = { img }; };
    return;
  }
  const img = spriteCache[key]?.img;
  if (img) ctx.drawImage(img, sx, sy, sw, sh);
}

function render(hours) {
  const sky = getSkyColor(hours);
  ctx.fillStyle = `rgb(${sky.r},${sky.g},${sky.b})`;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  const offX = -camera.x, offY = -camera.y;

  // Draw world tiles
  const startTileX = Math.max(0, Math.floor(camera.x / TILE) - 1);
  const startTileY = Math.max(0, Math.floor(camera.y / TILE) - 1);
  const endTileX = Math.min(WORLD_W, Math.ceil((camera.x + canvas.width) / TILE) + 1);
  const endTileY = Math.min(WORLD_H, Math.ceil((camera.y + canvas.height) / TILE) + 1);

  for (let y = startTileY; y < endTileY; y++) {
    for (let x = startTileX; x < endTileX; x++) {
      const t = world[y]?.[x]?.tile ?? T.GRASS;
      let sx = x * TILE + offX, sy = y * TILE + offY;

      // Base tile
      switch(t) {
        case T.GRASS: drawSprite('environment','grass',sx,sy,TILE,TILE); break;
        case T.SOIL:  drawSprite('environment','soil',sx,sy,TILE,TILE); break;
        case T.PATH:  drawSprite('environment','path',sx,sy,TILE,TILE); break;
        case T.WATER: drawSprite('environment','well',sx,sy,TILE,TILE); break;
        case T.BUNGALOW: drawSprite('buildings','bungalow',sx,sy,TILE,TILE); break;
        case T.SHED:  drawSprite('buildings','shed',sx,sy,TILE,TILE); break;
        case T.WELL:  drawSprite('environment','well',sx,sy,TILE,TILE); break;
        case T.TREE:  drawSprite('environment','palm',sx,sy,TILE,TILE); break;
        case T.COCONUT: drawSprite('environment','coconut',sx,sy,TILE,TILE); break;
        default: ctx.fillStyle='#4CAF50'; ctx.fillRect(sx,sy,TILE,TILE);
      }
    }
  }

  // Draw plots with crops (sorted by Y for depth)
  const sortedPlots = [...state.plots].filter(p => p.crop).sort((a,b) => a.y - b.y);
  for (const plot of sortedPlots) {
    if (!plot.crop) continue;
    const crop = CROPS[plot.crop];
    const elapsed = (Date.now() - plot.plantedAt) / 60000;
    const growTime = crop.growTime;
    const progress = Math.min(elapsed / growTime, 1);
    const stage = progress < 0.33 ? 1 : progress < 0.66 ? 2 : progress < 1 ? 3 : 4;
    const sx = plot.x * TILE + offX, sy = plot.y * TILE + offY;
    drawSprite('crops', `${plot.crop}_${stage}`, sx, sy, TILE, TILE);
    
    // Progress bar
    if (progress < 1) {
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.fillRect(sx+1, sy+TILE-4, TILE-2, 3);
      ctx.fillStyle = progress < 0.5 ? '#FFC107' : '#4CAF50';
      ctx.fillRect(sx+1, sy+TILE-4, (TILE-2)*progress, 3);
    } else {
      // Ready to harvest — pulsing border
      const pulse = 0.5 + 0.5 * Math.sin(Date.now() / 300);
      ctx.strokeStyle = `rgba(255,255,255,${pulse * 0.7})`;
      ctx.lineWidth = 1;
      ctx.strokeRect(sx, sy, TILE-1, TILE-1);
    }
  }

  // Sort entities by Y for depth
  const entities = [
    {type:'player', y:player.y + player.h},
    {type:'npc',    y:npc.y + npc.h},
  ].sort((a,b) => a.y - b.y);

  for (const entity of entities) {
    if (entity.type === 'player') {
      const sx = player.x + offX, sy = player.y + offY;
      const key = `player_${player.facing}_${player.frame + 1}`;
      drawSprite('player', key, sx, sy, player.w, player.h);
    }
    if (entity.type === 'npc') {
      const sx = npc.x + offX, sy = npc.y + offY;
      const key = `elder_${npc.facing}_${npc.frame + 1}`;
      drawSprite('npcs', key, sx, sy, npc.w, npc.h);
    }
  }

  // Interaction prompt
  const nearbyPlot = state.plots.find(p => {
    const dx = p.x*TILE - player.x, dy = p.y*TILE - player.y;
    return Math.sqrt(dx*dx+dy*dy) < TILE*1.5;
  });
  const prompt = document.getElementById('interact-prompt');
  if (nearbyPlot && nearbyPlot.crop && state.selectedTool === 'harvest') {
    const elapsed = (Date.now() - nearbyPlot.plantedAt) / 60000;
    const growTime = CROPS[nearbyPlot.crop].growTime;
    if (elapsed >= growTime) {
      prompt.textContent = `Tap to harvest ${CROPS[nearbyPlot.crop].name}`;
      prompt.style.display = 'block';
    }
  } else if (nearbyPlot && !nearbyPlot.crop && state.selectedTool === 'plant') {
    prompt.textContent = `Tap to plant ${state.selectedCrop ? CROPS[state.selectedCrop].name : ''}`;
    prompt.style.display = 'block';
  } else {
    prompt.style.display = 'none';
  }
}

// ═══════════════════════════════════════════════════════════
// MAIN LOOP
// ═══════════════════════════════════════════════════════════
let lastTime = 0;
let timeUpdateTimer = 0;
let currentHour = 0;

function gameLoop(timestamp) {
  const dt = Math.min((timestamp - lastTime) / 1000, 0.1);
  lastTime = timestamp;

  updatePlayer(dt);
  updateNPC(dt);
  updateCamera();

  timeUpdateTimer += dt;
  if (timeUpdateTimer > 10) {
    currentHour = updateTimeDisplay();
    timeUpdateTimer = 0;
    updateHUD();
  }

  render(currentHour);
  requestAnimationFrame(gameLoop);
}

// ═══════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════
initFarm();
updateTimeDisplay();
updateHUD();
requestAnimationFrame(gameLoop);
</script>
</body>
</html>
